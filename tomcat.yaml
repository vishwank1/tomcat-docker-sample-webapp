apiVersion: apps/v1
kind: Deployment
metadata:
  name: tomcat-sample
spec:
  replicas: 2
  selector:
    matchLabels: {app: tomcat-sample}
  template:
    metadata:
      labels: {app: tomcat-sample}
    spec:
      containers:
      - name: tomcat
        image: tomcat-sample:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet: {path: /, port: 8080}
          initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: tomcat-sample
spec:
  type: NodePort
  selector: {app: tomcat-sample}
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
